name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binaries
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w" -o dist/subtracker-linux-amd64 .
          GOOS=linux GOARCH=arm64 go build -ldflags "-s -w" -o dist/subtracker-linux-arm64 .
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w" -o dist/subtracker-darwin-amd64 .
          GOOS=darwin GOARCH=arm64 go build -ldflags "-s -w" -o dist/subtracker-darwin-arm64 .
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w" -o dist/subtracker-windows-amd64.exe .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
